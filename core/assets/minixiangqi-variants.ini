# Mini Xiangqi variant configuration for the pinned Fairy-Stockfish fork.
#
# This is the bundled configuration file docs/engine-integration.md names, under
# the filename it fixes: minixiangqi-variants.ini. The core loads it by setting
# the engine's VariantPath option; it is never loaded through the engine's own
# UCI loop, so the FAIRY_STOCKFISH_VARIANT_PATH environment variable cannot
# substitute a different file.
#
# Every value below is derived from an accepted contract and from the fork's own
# option documentation at the pinned revision
# (77d602e00db0527781e6abb76802bf1757f7e6fa, src/variants.ini). Nothing here is
# a preference.
#
# The file is pinned by SHA-256 in pinned-inputs.json under `variant`. Editing it
# changes that hash and the packaging build must be updated in the same change,
# or it will fail rather than ship unverified bytes.

################################################################################
# minixiangqiaxf — the target variant
################################################################################
#
# Identifier and derivation: docs/engine-integration.md, "Accepted variant
# packaging". The name is deliberately distinct from built-in `minixiangqi` so
# that both can be selected in one build, which the fixture harness needs in
# order to run the target and its control side by side.
#
# Inheritance syntax is `[child:parent]` (src/variants.ini, "Inheritance"), and
# only the differences from the parent are stated. The parent is the fork's
# built-in `minixiangqi`, which fixes the board geometry (7x7), the piece set
# (rook, horse, cannon, soldier, king), the palace mobility regions, the wazir
# king, the flying general, and the starting position. Keeping that parent
# unchanged is what keeps the pinned NNUE network structurally valid for this
# variant, per docs/engine-integration.md.

[minixiangqiaxf:minixiangqi]

# nMoveRule: move count for the 50/n-move rule [int] (default: 50)
#   src/variants.ini:253. `minixiangqi` inherits the chess default of 50.
#   docs/engine-integration.md requires the inherited move-count rule disabled;
#   0 is how this engine expresses "no move-count rule". Mini Xiangqi has no
#   such rule, and docs/xiangqi-rules.md adjudicates repetition rather than
#   move count.
nMoveRule = 0

# nFoldRule: move count for the 3/n-fold repetition rule [int] (default: 3)
#   src/variants.ini:254. Stated explicitly rather than left to the inherited
#   default because docs/engine-integration.md fixes it as part of the accepted
#   configuration: a later change to the engine's default must not silently
#   change this variant.
nFoldRule = 3

# chasingRule: enable chasing rules [ChasingRule: axf, none] (default: none)
#   src/variants.ini:132, 259. `minixiangqi` has no chasing rule, which is why
#   it cannot satisfy the unilateral-chase fixtures; AXF chasing adjudication is
#   the accepted target behaviour in docs/engine-integration.md, and the rules it
#   implements are the ones docs/xiangqi-rules.md accepts — a unilateral
#   perpetual chaser loses, a mutual same-class violation draws, and checking
#   takes precedence over chasing.
chasingRule = axf

# promotedSoldiersChaseable: allow promoted soldiers to be chase targets;
#   requires chasingRule, and does not affect discovered checks
#   [bool] (default: true)
#   src/variants.ini:260. The property is the fork's landed soldier-chase-target
#   exclusion (pinned-inputs.json, fork.patches/soldier-chase-target-exclusion).
#   Mini Xiangqi soldiers move sideways from the start, so the engine treats
#   every one of them as internally promoted and, with the default, as a chase
#   target. docs/xiangqi-rules.md excludes generals and soldiers as chase
#   targets, and the approved fixture fixtures/rules/mx-chs-003 requires it.
promotedSoldiersChaseable = false

# Deliberately not restated, and inherited from `minixiangqi` unchanged:
#
#   perpetualCheckIllegal = true   docs/engine-integration.md requires the
#                                  illegal-perpetual-check adjudication to be
#                                  preserved, and the parent already sets it
#                                  (src/variant.cpp, minixiangqi_variant).
#   nFoldValue = draw              The accepted neutral-threefold-repetition
#                                  result, and the engine's default
#                                  (src/variants.ini:255).
#   maxRank / maxFile / pieces / startFen / mobilityRegion / kingType /
#   flyingGeneral / castling / doubleStep / stalemateValue
#                                  Geometry and piece set are identical to
#                                  built-in `minixiangqi` by requirement; the
#                                  variant differs only in adjudication.
#
# Restating an inherited value would make this file look like it owns a decision
# it does not. The four keys above are the complete difference from the parent.
