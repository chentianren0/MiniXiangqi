name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # The runner has none of the team's certificates, so everything is
      # signed ad hoc. The app's restricted entitlements would stop such a
      # build at launch, and an unsigned build leaves the UI test runner
      # unsigned, which macOS kills.
      - name: App tests
        run: >
          xcodebuild test
          -project MiniXiangqi.xcodeproj
          -scheme MiniXiangqi
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
          CODE_SIGN_ENTITLEMENTS=
      - name: Core tests
        if: ${{ !cancelled() }}
        working-directory: core
        run: swift test
