# The Windows frontend: the core as a DLL, the bindings, the C# projects, the
# headless harness, pictures of the board, and the zip anybody is given.
#
# The obligation is issue #80's, carried from #85's verify: "the next
# Windows-frontend PR owes CI an `mxq_core_shared` build and a `generate.ps1`
# diff check, so the DLL export path and the bindings cannot drift silently."
# Both are here, and three more things came with them:
#
#   * the smoke harness, which is where this frontend's behaviour is actually
#     run — a WinUI 3 process cannot be launched without an interactive desktop,
#     so a whole game against the AI is played through the play screen's own
#     session logic headlessly instead;
#   * the offscreen board renders, which are how anybody sees what the board
#     looks like. Win2D needs a Direct2D device and Direct2D refuses in session
#     0, so the development VM cannot draw one over SSH; a hosted runner has a
#     console session and can. Every set of PNGs committed under
#     docs/evidence/pr<number>/ came from this job, and it uploads a fresh set on
#     every run;
#   * the distribution, which is a zip somebody unpacks and runs (issue #80,
#     owner decision, 2026-07-30). This workflow is where it is built, because
#     it is the only place both architectures exist.
#
# TWO ARCHITECTURES, AND WHY THE CORE'S OWN ARM64 SUITES ARE NOT HERE
#
# The matrix below builds, runs and packages the frontend on x64 and on ARM64,
# each on its own native runner. The core's ARM64 *suites* are in
# core-suites.yml instead, beside the x64 ones, and that file says why: what
# decides a job's home is which changes should start it, and a fixtures change
# starts core-suites.yml and not this workflow.
#
# THE NETWORK IS IN THE ARTIFACT, AND THE ZIP IS THE WHOLE APP
#
# It used to be the one thing the zip deliberately left out: a public
# repository's artifacts are downloadable by any logged-in account, and the
# community-trained network's redistribution licence was never established, so
# the zip carried a NETWORK.md naming a file its holder had to add. That
# network is gone. The one this project trained is in the repository, ours to
# publish, and it travels in the zip like every other asset — so there is one
# artifact, complete, and the harness that runs from inside the unpacked copy
# below is running against exactly what a person downloads.
#
# WHAT THIS WORKFLOW NAMES THAT THE REPOSITORY DOES NOT: the runner images and
# the .NET SDK feature band. Both are for the reason core-suites.yml gives about
# its own image pin — an exact label rather than a floating one, so the inputs
# are visible. What the packaging build measured about the frontend's toolchain
# is now recorded in pinned-inputs.json's Windows entry, which is what that
# entry was waiting for.

name: Windows frontend

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'core/**'
      - 'pinned-inputs.json'
      - 'docs/copy.md'
      - 'apple/MiniXiangqi/Sounds/**'
      - 'LICENSE'
      - '.github/workflows/windows-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'core/**'
      - 'pinned-inputs.json'
      - 'docs/copy.md'
      - 'apple/MiniXiangqi/Sounds/**'
      - 'LICENSE'
      - '.github/workflows/windows-frontend.yml'

# A superseded push to a pull request cancels the run it superseded: the core is
# a multi-minute C++ build on every runner and the older answer is worthless the
# moment a newer commit exists. Pushes to main are never cancelled, because
# main's history is the record.
concurrency:
  group: windows-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Windows frontend (MSVC + .NET, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Neither architecture's answer is worth cancelling for the other's. An
    # ARM64 failure is a finding about ARM64, and the x64 result beside it is
    # what says whether it is architecture-specific.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rid: win-x64
            # The bindings check, the sound-sample comparison and the board
            # renders run on one architecture only, and this is it. The first
            # two are source-level checks — ClangSharp reads a header and
            # Get-FileHash reads a .wav — and running them twice would prove
            # nothing the first run did not. The renders are pictures of a board
            # whose every dimension is architecture-independent, and Win2D over
            # Direct2D on a hosted ARM64 VM is an unknown this rung has no need
            # to spend a job on.
            source_checks: true
          - arch: arm64
            runner: windows-11-arm
            rid: win-arm64
            source_checks: false
    steps:
      # Pinned to a commit, not to the v5 tag: a tag is mutable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Everything pinned-inputs.json's Windows entry records comes from a run
      # like this one rather than from intent, so the values it records have to
      # be readable somewhere. This is that somewhere: the Visual Studio
      # installation, the MSVC toolset, the Windows SDKs installed, CMake, Ninja
      # and the .NET SDK, on whichever architecture this leg is.
      - name: Record the toolchain
        shell: pwsh
        run: |
          Write-Host "processor architecture: $env:PROCESSOR_ARCHITECTURE"
          cmd /c ver

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -format json | ConvertFrom-Json
            Write-Host "visual studio: $($vs[0].displayName) $($vs[0].installationVersion)"
            $toolset = Join-Path $vs[0].installationPath 'VC\Tools\MSVC'
            Get-ChildItem -Directory $toolset -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "msvc toolset: $($_.Name)" }
            Get-ChildItem -Directory (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include') -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "windows sdk: $($_.Name)" }
          }

          foreach ($tool in 'cmake', 'ninja') {
            if (Get-Command $tool -ErrorAction SilentlyContinue) {
              Write-Host "$tool $(& $tool --version | Select-Object -First 1)"
            } else {
              Write-Host "$tool is not on PATH; build-core-dll.ps1 falls back to the one Visual Studio ships."
            }
          }

          dotnet --info | Select-Object -First 8
          Write-Host "session id: $((Get-Process -Id $PID).SessionId)"

      # MXQ_BUILD_SHARED_LIBRARY=ON, which is the export path #85 added and the
      # thing this job exists to keep from breaking silently. The script builds
      # for the machine it is on, so this line is the same on both runners and
      # the architecture comes from the runner. The network needs no argument:
      # it is in the checkout, and core/CMakeLists.txt verifies it against
      # pinned-inputs.json before staging a byte of it.
      - name: Build the core as a DLL
        shell: pwsh
        run: pwsh windows/build-core-dll.ps1 -Architecture ${{ matrix.arch }}

      # A Mxq.g.cs that differs from what the generator writes is a
      # transcription of the header rather than the header.
      - name: Regenerate the bindings and fail on any difference
        if: matrix.source_checks
        shell: pwsh
        run: |
          pwsh windows/bindings/generate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The bindings generator did not run.' }
          git diff --exit-code -- windows/MiniXiangqi.Core/Generated/Mxq.g.cs
          if ($LASTEXITCODE -ne 0) {
            throw 'The committed bindings differ from what ClangSharp generates from core/include/mxq.h. Run windows/bindings/generate.ps1 and commit the result.'
          }

      # The board's four voices are one set of samples with one generator,
      # apple/Sounds/generate.py, and both frontends bundle its output. They are
      # copied rather than referenced across the two trees — a cross-tree csproj
      # reference would make the Windows build depend on the Apple app's own
      # directory layout, and the two campaigns run in parallel over disjoint
      # trees — so this is what keeps the copies from drifting. A retune that
      # reached one bundle and not the other would otherwise leave the same board
      # sounding different on two platforms, which is exactly the bug nobody would
      # notice from either side.
      #
      # It reads apple/ and writes nothing there.
      - name: The four voices are the same four voices
        if: matrix.source_checks
        shell: pwsh
        run: |
          $mismatched = @()
          foreach ($voice in 'plain', 'capture', 'check', 'conclusion') {
            $name = "board-$voice.wav"
            $mac = Get-FileHash "apple/MiniXiangqi/Sounds/$name" -Algorithm SHA256
            $win = Get-FileHash "windows/MiniXiangqi.Play/Sounds/$name" -Algorithm SHA256
            Write-Host "$name  $($mac.Hash.ToLower())"
            if ($mac.Hash -ne $win.Hash) { $mismatched += $name }
          }
          if ($mismatched.Count -gt 0) {
            throw "These samples differ between apple/MiniXiangqi/Sounds and windows/MiniXiangqi.Play/Sounds: $($mismatched -join ', '). Both bundles are outputs of apple/Sounds/generate.py; run it and copy all four."
          }

      - name: Build every project
        shell: pwsh
        run: dotnet build windows/MiniXiangqi.slnx -c Release --nologo

      # The frontend's own evidence: the whole boundary, the wrapper, the string
      # table against docs/copy.md, and a game against the AI played through the
      # play screen's session. On the ARM64 runner this is also the first time
      # anything above the C interface has run on that architecture at all, so
      # the harness's own "process" line is part of what the run reports.
      - name: Run the smoke harness
        shell: pwsh
        run: |
          $exe = 'windows/MiniXiangqi.Smoke/bin/Release/net10.0-windows/MiniXiangqi.Smoke.exe'
          & $exe --copy-table docs/copy.md
          if ($LASTEXITCODE -ne 0) { throw "The smoke harness failed with $LASTEXITCODE." }

      - name: Render the board
        if: matrix.source_checks
        shell: pwsh
        run: |
          $exe = 'windows/MiniXiangqi.Shots/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/MiniXiangqi.Shots.exe'
          & $exe --out shots
          if ($LASTEXITCODE -ne 0) { throw "The render harness failed with $LASTEXITCODE." }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.source_checks
        with:
          name: board-renders
          path: shots/*.png
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # The distribution
      # ---------------------------------------------------------------------
      #
      # windows/package-zip.ps1 publishes the app and the self-check
      # self-contained into one directory, verifies the staged network against
      # pinned-inputs.json, adds the licence and the attribution note, checks
      # that every native binary is this architecture, and zips it. Everything
      # it decides is argued there rather than here.
      - name: Build the distribution zip
        shell: pwsh
        run: pwsh windows/package-zip.ps1 -Architecture ${{ matrix.arch }}

      # The proof that the zip runs, rather than the assumption that it does.
      #
      # The artifact is unpacked into a directory of its own and the harness that
      # came out of the zip is run against the zip's own layout — its own
      # mxqcore.dll, its own assets, its own network, its own runtime, at the
      # paths a person who unpacked it would have. Nothing from the build tree is
      # on that path, and nothing is added to the unpacked tree: what runs here
      # is byte-for-byte what a person downloads, which is what this step could
      # not claim while the network had to be dropped in first.
      - name: Run the harness from inside the unpacked zip
        shell: pwsh
        run: |
          $zip = "windows/dist/MiniXiangqi-windows-${{ matrix.arch }}.zip"
          $proof = Join-Path $env:RUNNER_TEMP 'zip-proof'
          if (Test-Path $proof) { Remove-Item $proof -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $proof
          $unpacked = Join-Path $proof "MiniXiangqi-windows-${{ matrix.arch }}"

          Write-Host 'As unpacked:'
          Get-ChildItem (Join-Path $unpacked 'assets') | ForEach-Object {
            Write-Host ("  assets\{0}  {1:N0} bytes" -f $_.Name, $_.Length)
          }

          # No --copy-table: docs/copy.md is not in the zip and has no business
          # being. The string table is checked against the contract by the build
          # tree's run above; what this run is for is the layout.
          & (Join-Path $unpacked 'MiniXiangqi.Smoke.exe')
          if ($LASTEXITCODE -ne 0) { throw "The harness failed inside the unpacked zip with $LASTEXITCODE." }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MiniXiangqi-windows-${{ matrix.arch }}
          path: windows/dist/MiniXiangqi-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          # The default is 90 days. A fortnight is what an internal build is
          # worth keeping: it is reproducible from the commit it was built at,
          # and a stale zip somebody finds later is a build nobody chose.
          retention-days: 14
