# The core suites, on a macOS runner and two Windows runners.
#
# docs/architecture.md fixes what this workflow is for: "GitHub Actions CI
# covers BOTH a macOS runner and a Windows runner, so neither platform is ever
# reproducible only on one machine." It is a convenience rather than a merge
# gate; what it guarantees is that every platform is buildable somewhere other
# than one developer's machine.
#
# Windows now has two entries rather than one, x64 and ARM64, and the ARM64 one
# is here rather than in windows-frontend.yml deliberately. What decides which
# workflow a job belongs to is which changes should start it: this workflow
# starts on core/, fixtures/, .gitattributes and .github/scripts/, and the
# frontend workflow does not. A fixtures change that broke the engine on ARM64
# and only ARM64 would, if the job lived over there, run the suites on macOS and
# Windows x64 and say nothing — which is the hole the architecture was added to
# close. The ARM64 *frontend* build, the harness on that architecture and the
# zip are windows-frontend.yml's, because those start on windows/.
#
# The ARM64 runner label is `windows-11-arm`, a GitHub-hosted Windows 11 ARM64
# machine, and it is free on public repositories exactly as the other two are.
#
# It also inherits that document's input rule — "CI must not receive
# undocumented inputs: pinned revisions and asset hashes come from the
# repository's manifests." Nothing here restates a hash or a revision. The
# engine revision, the variant configuration's SHA-256, and the network's byte
# length and SHA-256 all reach the build from pinned-inputs.json through
# core/CMakeLists.txt, which stages no byte it has not verified. The one value
# this file names that is not in the repository is the runner image, pinned to
# an exact label rather than to `-latest` for the same reason.
#
# The images are the newest GitHub hosts, not the oldest that still works: CI
# should track the toolchain this project actually uses rather than trail it
# (owner instruction, 2026-07-30). `macos-26` is the newest generally-available
# macOS image and is arm64, which is the only macOS architecture this product
# supports. GitHub also offers an `xcode-27` public-preview image, which is the
# same macOS 26 with a newer Xcode; it is deliberately not used, because a
# preview image carries no Actions SLA and `macos-26` already provides the
# Apple clang major this project builds with.
#
# Both configurations run on both platforms. docs/testing.md requires it and
# says why: the error taxonomy's programming errors assert where NDEBUG is
# undefined and return their code where it is defined, so a release run is the
# only one that observes those codes and a debug run is the only one that
# exercises the assertions.
#
# What this does NOT prove is the pinned toolchain, even now that the images
# are the newest available. The runners carry whatever their images carry, and
# the images move on their own schedule; what CI answers is "does this build
# and pass on a machine that is not the one it was written on". Reproducing the
# pin is a developer-machine claim and stays one.

name: Core suites

on:
  pull_request:
    paths:
      - 'core/**'
      - 'fixtures/**'
      - 'pinned-inputs.json'
      - '.gitattributes'
      - '.github/workflows/core-suites.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'fixtures/**'
      - 'pinned-inputs.json'
      - '.gitattributes'
      - '.github/workflows/core-suites.yml'
      - '.github/scripts/**'

# A docs-only or apple-only change cannot move these suites, so it does not
# start them; the paths filters above are what say so, and they are written
# twice because GitHub Actions does not read YAML anchors. `.gitattributes` is
# in them for a reason that is not obvious from its size: it governs the bytes
# every checkout produces, and the hash-pinned trees refuse to configure if
# those bytes are rewritten. A change to it that broke a platform and started
# no run would surface on whatever core pull request came next, attributed to
# the wrong change. A superseded push to
# a pull request cancels the run it superseded, because the engine is a
# multi-minute build on every runner and the older answer is worthless the
# moment a newer commit exists. Pushes to main are never cancelled: main's
# history is the record.
concurrency:
  group: core-suites-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple clang, arm64)
    runs-on: macos-26
    steps:
      # Pinned to a commit, not to the v5 tag: a tag is mutable, and it was the
      # last input to this workflow that could change under us without the
      # repository saying so.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record the toolchain
        run: |
          sw_vers
          uname -m
          cmake --version
          cc --version

      # The network never enters version control, in any form
      # (docs/engine-integration.md, "Accepted NNUE handling policy"), and this
      # repository is public, so it is not attached to a release here either. It
      # is cloned instead from the private ppppvz/minixiangqi-assets repository,
      # with the read-only deploy key below. See
      # .github/scripts/fetch-network.sh for why, for the URL alternative it
      # also accepts, and for what happens when neither is configured: the one
      # suite that needs a network does not run, every other suite does, and the
      # job summary says so. Both secrets are named on both jobs, because a
      # suite that runs on one platform and is skipped on the other proves
      # nothing about the platform that skipped it.
      - name: Fetch the pinned network
        id: network
        env:
          MXQ_NNUE_DEPLOY_KEY: ${{ secrets.MXQ_NNUE_DEPLOY_KEY }}
          MXQ_NNUE_URL: ${{ secrets.MXQ_NNUE_URL }}
        run: .github/scripts/fetch-network.sh

      - name: Configure, build and run both configurations
        env:
          MXQ_NNUE_SOURCE: ${{ steps.network.outputs.path }}
          MXQ_CTEST_EXCLUDE: ${{ steps.network.outputs.exclude }}
        run: .github/scripts/run-suites.sh single-config build

  windows:
    name: Windows (MSVC, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Neither architecture's answer is worth cancelling for the other's: a
    # failure on one is a finding about that one, and the other's result is the
    # thing that says whether it is architecture-specific.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: ARM64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to a commit, not to the v5 tag: a tag is mutable, and it was the
      # last input to this workflow that could change under us without the
      # repository saying so.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # PROCESSOR_ARCHITECTURE here is the *shell's* rather than the machine's,
      # and on the ARM64 runner it reads AMD64 because git-bash is an x64 build
      # running under Windows' emulation. That is worth seeing rather than
      # hiding — it is why the generator platform is passed to the script
      # explicitly below instead of being inferred from the environment. What
      # the build actually targeted is CMAKE_GENERATOR_PLATFORM, which
      # run-suites.sh prints from the cache.
      - name: Record the toolchain
        run: |
          cmake --version
          cmd //c ver
          echo "shell's own architecture: ${PROCESSOR_ARCHITECTURE:-unknown}"

      - name: Fetch the pinned network
        id: network
        env:
          MXQ_NNUE_DEPLOY_KEY: ${{ secrets.MXQ_NNUE_DEPLOY_KEY }}
          MXQ_NNUE_URL: ${{ secrets.MXQ_NNUE_URL }}
        run: .github/scripts/fetch-network.sh

      - name: Configure, build and run both configurations
        env:
          MXQ_NNUE_SOURCE: ${{ steps.network.outputs.path }}
          MXQ_CTEST_EXCLUDE: ${{ steps.network.outputs.exclude }}
        run: .github/scripts/run-suites.sh multi-config build ${{ matrix.arch }}
